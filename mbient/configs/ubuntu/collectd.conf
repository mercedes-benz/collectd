################################################################################
# pre initialization
################################################################################

<Include "/tmp/collectd/before.conf.d">
  Filter "*.conf"
</Include>

################################################################################
# global
################################################################################

ClockType monotonic # realtime, monotonic or boottime
Interval 3
Timeout 60
BaseDir "/tmp/collectd/rrd"
TypesDB "./src/types.db"
TypesDB "./mbient/mbient-types.db"
ReadThreads 2
WriteThreads 1
ReadPluginProfiling false
WritePluginProfiling false
DispatchValueProfiling true
DispatchNotificationProfiling true

################################################################################
# logging
################################################################################

LoadPlugin "logfile"
<Plugin "logfile">
  LogLevel "notice"
  #LogLevel "debug"
  PrintSeverity true
  Timestamp true
  File "/tmp/collectd/collectd.log"
</Plugin>

################################################################################
# input
################################################################################

# ------------------------------------------------------------------------------
LoadPlugin "buddyinfo"
<Plugin "buddyinfo">
</Plugin>

# ------------------------------------------------------------------------------
LoadPlugin "cgroups2"
<Plugin "cgroups2">
  CGroupVersion 2 # CGroupVersion 0  # 0-auto, 1-v1, 2-v2
  MountCache true
  CpuPressure true
  MemPressure true
  IOPressure true
  MemoryUnit "MB"
  MaxLevel 1
  SortAlphabetical true
  ProcessCount true
  ThreadCount true
  SwapMemory true
</Plugin>

# ------------------------------------------------------------------------------
LoadPlugin "contextswitch"
<Plugin "contextswitch">
</Plugin>

# ------------------------------------------------------------------------------
LoadPlugin "cpu"
<Plugin "cpu">
  ReportByCpu true
  ReportByState true
  ValuesPercentage true
  ReportNumCpu true
  #ReportCpuPressure true
  ReportGuestState false
  SubtractGuestState true
  ReportActiveState true
</Plugin>

# ------------------------------------------------------------------------------
<LoadPlugin "df">
  Interval 300
</LoadPlugin>
<Plugin "df">
  MountPoint "//run/filesystem_storage/.*/"
  MountPoint "//media/.*/"
  MountPoint "//mnt/media/.*/"
  IgnoreSelected true
</Plugin>

# ------------------------------------------------------------------------------
LoadPlugin "disk"
<Plugin "disk">
</Plugin>

# ------------------------------------------------------------------------------
LoadPlugin "entropy"
<Plugin "entropy">
</Plugin>

# ------------------------------------------------------------------------------
LoadPlugin "ethstat"
<Plugin "ethstat">
  Interface "eth0"
</Plugin>

# ------------------------------------------------------------------------------
LoadPlugin "interface"
<Plugin "interface">
  Interface "lo"
  Interface "/^veth/"
  Interface "/^tun[0-9]+/"
  IgnoreSelected true
  ReportInactive false
</Plugin>

# ------------------------------------------------------------------------------
LoadPlugin "irq"
<Plugin "irq">
</Plugin>

# ------------------------------------------------------------------------------
LoadPlugin "load"
<Plugin "load">
</Plugin>

# ------------------------------------------------------------------------------
LoadPlugin "memory2"
<Plugin "memory2">
  ValuesAbsolute true
  ValuesPercentage false
  ExtraStats true
  MemoryUsage true
  MemoryPressure true
</Plugin>

# ------------------------------------------------------------------------------
# ProcessMatch "name" "cmd line regex" ["user name regex" ["cgroup regex"]]
# optimizations:
# - start with '=' --> exact match
# - start with '>' --> match of the start only

LoadPlugin "processes2"
<Plugin "processes2">
  CollectFileDescriptor false
  CollectContextSwitch false
  CollectMemoryMaps false
  CollectProportionalSetSize false
  CollectDelayAccounting false

  <ProcessGroup user>
    CollectCpuRank true
    CollectCpuPercent absolute
    NotifyCpuTop 5
    ProcessMatch "%U" ".*"
  </ProcessGroup>

  <ProcessGroup cgroup>
    CollectCpuRank true
    CollectCpuPercent absolute
    NotifyCpuTop 5
    ProcessMatch "%G" ".*"
  </ProcessGroup>

  <ProcessGroup program>
    #CollectCpuRank true
    CollectCpuPercent absolute
    NotifyCpuTop 10
    NotifyMemTop 10
    NotifyMemDiffTop 5
    NotifyCpuTopSingleLine 10
    NotifyMemTopSingleLine 10
    NotifyIOTopReadSingleLine 10
    NotifyIOTopWriteSingleLine 10
    ProcessMatch "%N" ".*"
  </ProcessGroup>

  <ProcessGroup budget>
    CollectCpuRank true
    CollectCpuPercent absolute
    NotifyCpuTop 10

    # ##### Test #####

    # integraion test
    ProcessMatch "test-resmgr" "resource-monitor-test-"

    # ##### System #####

    # IC Integration Base + HUD
    ProcessMatch "system-ic" ".*" "=ic-services"
    # User Data Managment
    ProcessMatch "system-udm" ".*" "=personalization-srv"
    # System Update
    ProcessMatch "system-update" ".*" "=swup"
    # HMI
    ProcessMatch "system-hmi" ".*" "=carbon-ui"
    # SAR (Event logging Displays)
    ProcessMatch "system-sar" ".*" "=system-analysis-recorder"

    # ##### Services #####

    # OMS Front
    ProcessMatch "service-occupancy" ".*" "=occupant"
    # Unified Data Collector (Telelog / HD Map Data Collector)
    ProcessMatch "service-data-collector" ".*" "=udc"
    # UDC Toolbox
    ProcessMatch "service-data-toolbox" ".*" "=data-toolbox"
    # navsensord (service navsensord on RichOS/Apricot)
    ProcessMatch "service-navsonsord" ".*" "=navsensord"
    # User Prediction / myAI
    ProcessMatch "service-myai" ".*" "=learning"
    # SDS (Speech Dialog System)
    ProcessMatch "service-speech" ".*" ">speech"
    # Handwrite Recognition/Speller
    ProcessMatch "service-speller" ".*" "=speller"
    # UCH (Unified Call Handler)
    ProcessMatch "service-call" ".*" "=unified-phone"

    # ##### Applications #####

    # 3D Base Navigation
    ProcessMatch "app-nav" ".*" "=nav"
    # Browser
    ProcessMatch "app-browser" ".*" "=browser"
    # Augmented Reality (Positioning,  Video Rendering, HUD Rendering)
    ProcessMatch "app-augmented" ".*" "=augmented"
    # TV Tuner (step3)
    ProcessMatch "app-tuner-tv" ".*" "=tunertv-service"
    # Radio Tuner incl. SiriusXM
    ProcessMatch "app-tuner-radio" ".*" ">tuner-"
    # Player (A), Player (V)
    ProcessMatch "app-player" ".*" ">player-"
    # Phone Appl incl. BlueGo Frameworks(1x/2x) processes
    ProcessMatch "app-phone" ".*" "^(bluego|smp)$"
    # Dynamic Content (NCP)
    ProcessMatch "app-dynamic" ".*" "=dyncontents"
    # Basis Android System (Central Display)
    ProcessMatch "app-starfish" ".*" "=starfish"
    # Dashcam
    ProcessMatch "app-dashcam" ".*" "=dashcam"

    # ##### Other #####

    # remaining components
    ProcessMatch "other" ".*"
  </ProcessGroup>
</Plugin>

# ------------------------------------------------------------------------------
LoadPlugin "sdbus"
<Plugin "sdbus">
</Plugin>

# ------------------------------------------------------------------------------
<LoadPlugin "sdnotify">
  Interval 3
</LoadPlugin>
<Plugin "sdnotify">
  ReadyOnInit        true
  WatchdogOnRead     true
  WatchdogOnWrite    false
  StoppingOnShutdown true
</Plugin>

# ------------------------------------------------------------------------------
LoadPlugin "vmem"
<Plugin "vmem">
  Verbose false
</Plugin>


################################################################################
# threshold
################################################################################

<Include "/etc/collectd.conf.d">
  Filter "*-threshold-*.conf"
</Include>

LoadPlugin "threshold"
<Plugin "threshold">
# <Host "cmtcleu60075563.fritz.box">
  <Plugin "processes2">
    Instance "budget-test-resmgr"
    <Type "ps_rss">
      WarningMin    5000000
      WarningMax   15000000
      FailureMin    2500000
      FailureMax   20000000
      #Persist true
      #PersistOK true
      #Hits 1
    </Type>
  </Plugin>
# </Host>
</Plugin>

################################################################################
# aggregation
################################################################################

LoadPlugin "aggregation"
<Plugin "aggregation">
  <Aggregation>
    Plugin "cpu"
    Type "percent"
    TypeInstance "/^(system|user)$/"
    GroupBy "Host"
    GroupBy "TypeInstance"
    CalculateAverage true
  </Aggregation>
  <Aggregation>
    Plugin "irq"
    Type "irq"
    GroupBy "Host"
    CalculateSum true
    #SetPlugin "irq"
    #SetPluginInstance ""
    #SetTypeInstance "sum"
  </Aggregation>
</Plugin>

################################################################################
# output
################################################################################

# ------------------------------------------------------------------------------
LoadPlugin "unixsock"
<Plugin unixsock>
  SocketFile "/tmp/collectd.sock"
  SocketGroup "collectd"
  SocketPerms "0770"
  DeleteSocket true
</Plugin>

# ------------------------------------------------------------------------------
LoadPlugin "rrdtool"
<Plugin rrdtool>
  CreateFilesAsync false
  CacheTimeout 120
  CacheFlush   900
  WritesPerSecond 50
  RRATimeSpan 1200
</Plugin>

# ------------------------------------------------------------------------------
LoadPlugin "write_dlt"
<Plugin "write_dlt">
  Format GraphiteShort
  #Format Graphite
  #Format JSON
  <DLT>
    AppID CLTD
    #MatchLevel "^cpu" "info"
    #MatchContext "^cpu" "CPU1"
  </DLT>
  LogLevel  "info"
  LogTarget SERV
</Plugin>


################################################################################
# filter
################################################################################

LoadPlugin "match_empty_counter"
LoadPlugin "match_last_value"
LoadPlugin "match_other_value"
LoadPlugin "match_regex"
LoadPlugin "match_value"

# ------------------------------------------------------------------------------
<Chain "AGG">
  <Target "write">
    Plugin "aggregation"
  </Target>
</Chain>

# ------------------------------------------------------------------------------
<Chain "DLT-System">
  <Rule "plugin_filter">
    <Match "regex">
      Plugin "^(aggregation|load|memory)$"
      Invert true
    </Match>
    Target "return"
  </Rule>
  <Rule "ignore_same_value">
    <Match "last_value">
      DiffRel 0.001
    </Match>
    Target "return"
  </Rule>
  <Target "write">
    Plugin "write_dlt"
  </Target>
</Chain>

# ------------------------------------------------------------------------------
<Chain "DLT-Top3">
  <Rule "process2_filter">
    <Match "regex">
      Plugin "^(processes2)$"
      Invert true
    </Match>
    Target "return"
  </Rule>
  <Rule "rank-types">
    <Match "regex">
      Type "^(ps_rss|ps_cpu_percent|ps_cpu_rank)$"
      Invert true
    </Match>
    Target "return"
  </Rule>
  <Rule "rank-top">
    <Match "other_value">
      Type ps_cpurank
      Max 3
      Satisfy All
      Invert true
    </Match>
    Target "return"
  </Rule>
  <Target "write">
    Plugin "write_dlt"
  </Target>
</Chain>

# ------------------------------------------------------------------------------
<Chain "RRD">
  <Rule "ignore_empty_counter">
    Match "empty_counter"
    Target "return"
  </Rule>
  <Target "write">
    Plugin "rrdtool"
  </Target>
</Chain>

# ------------------------------------------------------------------------------
<Chain "PostCache">
  <Target "write">
    Plugin "threshold"
  </Target>

  <Rule "AGG">
    <Target "jump">
      Chain "AGG"
    </Target>
  </Rule>
  <Rule "DLT">
    <Target "jump">
      Chain "DLT-System"
    </Target>
  #  <Target "jump">
  #    Chain "DLT-Top3"
  #  </Target>
  </Rule>
  <Rule "RRD">
    <Target "jump">
      Chain "RRD"
    </Target>
  </Rule>

  Target "stop"
</Chain>

################################################################################
# post initialization
################################################################################

<Include "/tmp/collectd/after.conf.d">
  Filter "*.conf"
</Include>
