################################################################################
# global
################################################################################

Interval 5
#TypesDB "@typedb-file@"
FQDNLookup false
ReadThreads 1
WriteThreads 1

################################################################################
# logging
################################################################################

LoadPlugin "logfile"
<Plugin "logfile">
  LogLevel "info"
  File "/tmp/collectd.log"
  Timestamp true
</Plugin>

# ------------------------------------------------------------------------------
LoadPlugin "syslog"
<Plugin "syslog">
  LogLevel info
  NotifyLevel OKAY
</Plugin>

################################################################################
# read
################################################################################

# ------------------------------------------------------------------------------
LoadPlugin "cpu"
<Plugin "cpu">
    ReportByCpu true
    ReportByState true
    ValuesPercentage true
    ReportNumCpu true
    ReportGuestState false
    SubtractGuestState true
</Plugin>

# ------------------------------------------------------------------------------
LoadPlugin "processes2"
<Plugin "processes2">
  CollectFileDescriptor true
  CollectContextSwitch true
  CollectMemoryMaps true
  CollectDelayAccounting true
  CollectProportionalSetSize true
                  
	#ProcessMatch "name" "cmd line regex" ["user name regex" ["cgroup regex"]]
  #ProcessMatch "root" ".*" "root"
  #ProcessMatch "fbielig" "" "fbielig"
  <ProcessGroup "program">
    CollectFileDescriptor true
    CollectContextSwitch true
    CollectMemoryMaps true
    CollectDelayAccounting true
    CollectProportionalSetSize true
    #CollectCpuRank true
    #CollectCpuPercent absolute
    NotifyCpuTop 5
    #ProcessMatch "root" "" "" ".*dbus.*["
    ProcessMatch "%N" ".*"
  </ProcessGroup>
#  <ProcessGroup "cgroup">
#    #ProcessMatch "root" "" "" ".*dbus.*["
#    ProcessMatch "%G" ".*"
#  </ProcessGroup>
#  <ProcessGroup budget>
#    #ProcessMatch "name" "cmd line regex" ["user name regex" ["cgroup regex"]]
#    ProcessMatch "test-resmgr" "resource-monitor-test-.*"
#    # remaining components
#    ProcessMatch "other" ".*" 
#  </ProcessGroup>
</Plugin>

################################################################################
# threshold
################################################################################

# ------------------------------------------------------------------------------
LoadPlugin "threshold"
<Plugin "threshold">
  <Plugin "processes2">
    Instance "budget-test-resmgr"
    <Type "ps_rss">
      WarningMin    5000000
      WarningMax   15000000
      FailureMin    2500000
      FailureMax   20000000
    </Type>
  </Plugin>
</Plugin>


################################################################################
# write
################################################################################

# ------------------------------------------------------------------------------
LoadPlugin "unixsock"
<Plugin unixsock>
  SocketFile "/tmp/collectd.sock"
  SocketGroup "mbition"
  SocketPerms "0770"
  DeleteSocket true
</Plugin>

# ------------------------------------------------------------------------------
LoadPlugin "csv"
<Plugin "csv">
  DataDir "/tmp/collectd"
  StoreRates false
</Plugin>

################################################################################
# filter
################################################################################

LoadPlugin "match_regex"
LoadPlugin "match_value"
LoadPlugin "match_other_value"
LoadPlugin "match_empty_counter"

# ------------------------------------------------------------------------------
<Chain "CSV_ALL">
  <Rule "not_zero">
    <Match "value">
      Min -0.01
      Max 0.01
    </Match>
    Target "return"
  </Rule>
  <Target "write">
    Chain "write_csv"
  </Target>
</Chain>

# ------------------------------------------------------------------------------
<Chain "CSV2">
  <Rule "top-rule">
    <Match "regex">
      Plugin "^(processes2)$"
    </Match>
    <Match "other_value">
      Type ps_cpu_rank
      Max 10
      Satisfy All
    </Match>
    <Target "write">
      Chain "write_csv"
    </Target>
  </Rule>
  Target "return"
</Chain>

# ------------------------------------------------------------------------------
<Chain "CSV3">
  <Rule "rank-processes2">
    <Match "regex">
      Plugin "^(processes2)$"
      Invert true
    </Match>
    Target "return"
  </Rule>
  <Rule "rank-types">
    <Match "regex">
      Type "^(ps_rss|ps_cpu_percent|ps_cpu_rank)$"
      Invert true
    </Match>
    Target "return"
  </Rule>
  <Rule "rank-top">
    <Match "other_value">
      Type ps_cpu_rank
      TypeInstance "now"
      Max 10
      Satisfy All
      Invert true
    </Match>
    Target "return"
  </Rule>
  <Target "write">
    Chain "write_csv"
  </Target>
</Chain>

# ------------------------------------------------------------------------------
<Chain "PostCache">
  <Rule "CSV-Output">
    <Target "jump">
      Chain "CSV_ALL"
    </Target>
  </Rule>

  Target "stop"
</Chain>
