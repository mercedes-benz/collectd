################################################################################
# global
################################################################################

Interval 5
TypesDB "./src/types.db"
TypesDB "./mbient/mbient-types.db"
FQDNLookup false

################################################################################
# logging
################################################################################

LoadPlugin "logfile"
<Plugin "logfile">
  LogLevel "debug"
  File "/tmp/collectd/collectd.log"
  Timestamp true
</Plugin>


################################################################################
# read
################################################################################

# ------------------------------------------------------------------------------
LoadPlugin "cgroups2"
<Plugin "cgroups2">
</Plugin>

################################################################################
# write
################################################################################

# ------------------------------------------------------------------------------
LoadPlugin "unixsock"
<Plugin unixsock>
  SocketFile "/tmp/collectd.sock"
  SocketGroup "mbition"
  SocketPerms "0770"
  DeleteSocket true
</Plugin>

# ------------------------------------------------------------------------------
LoadPlugin "write_dlt"
<Plugin "write_dlt">
  Format GraphiteShort
  <DLT>
    AppID CLTD
  </DLT>
</Plugin>

# ------------------------------------------------------------------------------
LoadPlugin "csv"
<Plugin "csv">
  DataDir "/tmp/collectd"
  StoreRates false
</Plugin>

################################################################################
# filter
################################################################################

LoadPlugin "match_regex"
LoadPlugin "match_value"
LoadPlugin "match_empty_counter"

# ------------------------------------------------------------------------------
<Chain "CSV">
  <Rule "not_zero">
    <Match "value">
      Min -0.01
      Max 0.01
    </Match>
    Target "return"
  </Rule>
  <Target "write">
    Chain "write_csv"
  </Target>
</Chain>

# ------------------------------------------------------------------------------
<Chain "PostCache">
  <Rule "CSV">
    <Target "jump">
      Chain "CSV"
    </Target>
  </Rule>

  Target "stop"
</Chain>
