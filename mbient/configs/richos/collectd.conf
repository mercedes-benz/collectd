################################################################################
# filter
################################################################################

LoadPlugin "match_empty_counter"
LoadPlugin "match_last_value"
LoadPlugin "match_other_value"
LoadPlugin "match_regex"
LoadPlugin "match_value"

# ------------------------------------------------------------------------------
<Chain "DLT-System">
  <Rule "plugin_filter">
    <Match "regex">
      Plugin "^(aggregation|memory)$"
      Invert true
    </Match>
    Target "return"
  </Rule>
  <Rule "ignore_same_value">
    <Match "last_value">
      DiffRel 0.001
    </Match>
    Target "return"
  </Rule>
  <Target "write">
    Plugin "write_dlt"
  </Target>
</Chain>

# ------------------------------------------------------------------------------
<Chain "DLT-Top10">
  <Rule "process2_filter">
    <Match "regex">
      Plugin "^(processes2)$"
      Invert true
    </Match>
    Target "return"
  </Rule>
  <Rule "rank-types">
    <Match "regex">
      Type "^(ps_rss|ps_cpu_percent|ps_cpu_rank)$"
      Invert true
    </Match>
    Target "return"
  </Rule>
  <Rule "rank-top">
    <Match "other_value">
      Type ps_cpu_rank
      TypeInstance "now"
      Max 10
      Satisfy All
      Invert true
    </Match>
    Target "return"
  </Rule>
  <Target "write">
    Plugin "write_dlt"
  </Target>
</Chain>

