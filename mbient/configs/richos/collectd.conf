################################################################################
# pre initialization
################################################################################

<Include "/var/volatile/collectd/before.conf.d">
  Filter "*.conf"
</Include>

################################################################################
# global
################################################################################

ClockType boottime # realtime, monotonic or boottime
Interval 5
Timeout 60
#BaseDir "/var/volatile/collectd/rrd"
TypesDB "/usr/share/collectd/types.db"
TypesDB "/usr/share/collectd/mbient-types.db"
ReadThreads 2
WriteThreads 1
ReadPluginProfiling false
WritePluginProfiling false
DispatchValueProfiling false
DispatchNotificationProfiling false
Hostname RichOS

################################################################################
