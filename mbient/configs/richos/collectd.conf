LoadPlugin "cgroups2"
<Plugin "cgroups2">
  # CGroupVersion 0  # 0-auto, 1-v1, 2-v2
  MountCache true
  CpuPressure true
  MemPressure true
  IOPressure true
  MemoryUnit "MB"
  MaxLevel 1
  SortAlphabetical true
  ProcessCount true
# ProcessCountUnique true
  ThreadCount true
# ThreadCountUnique true
  SwapMemory true
  PageScan true
</Plugin>

