#  PrintSeverity true
#  Timestamp true
#  File "/var/volatile/collectd/collectd.log"
#</Plugin>

# ------------------------------------------------------------------------------
LoadPlugin "write_dlt"
<Plugin "write_dlt">
  Format GraphiteShort
  #Format Graphite
  #Format JSON
  <DLT>
    AppID CLTD
    #MatchLevel "^cpu" "info"
    #MatchContext "^cpu" "CPU1"
  </DLT>
  LogLevel "info"
</Plugin>

